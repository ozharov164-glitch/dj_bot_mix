name: CI and Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege at workflow level — Pages write only on deploy job.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build (CI-safe, localhost allowed)
        env:
          VITE_ALLOW_DEV_API: "true"
          VITE_API_URL: http://localhost:3000
          VITE_BASE_PATH: /dj_bot_mix/
        run: pnpm build
      - name: Build production Pages artifact
        id: pages_build
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          vars.ENABLE_PAGES_DEPLOY == 'true' &&
          vars.VITE_API_URL != ''
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /dj_bot_mix/
        run: pnpm build
      - name: Upload Pages artifact
        if: steps.pages_build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.ENABLE_PAGES_DEPLOY == 'true' &&
      vars.VITE_API_URL != ''
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
